name: hawatch-stage

# Three staging services only. The external network reaches the existing PostGIS.
# No database container, scheduler, maintenance, seed or migration entrypoint.
services:
  stage-api:
    image: hawatch-stage-api:${HAWATCH_STAGE_IMAGE_TAG:-latest}
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - ${HAWATCH_PRODUCTION_ENV_FILE:?Set absolute production .env path}
    environment:
      DJANGO_SETTINGS_MODULE: hawatch.config.settings.qa
      DJANGO_ALLOWED_HOSTS: ${HAWATCH_STAGE_ALLOWED_HOSTS:?Set stage IP/domain},stage-api,localhost,127.0.0.1
      HAWATCH_QA_ORIGIN: ${HAWATCH_STAGE_ORIGIN:?Set public stage origin}
      HAWATCH_PUBLIC_ORIGIN: ${HAWATCH_PUBLIC_ORIGIN:-https://hawatch.ir}
      POSTGRES_HOST: ${HAWATCH_PRODUCTION_DB_HOST:-postgres}
      POSTGRES_PORT: "5432"
      DEMO_DATA_ENABLED: "false"
      HAWATCH_BOOTSTRAP_LIVE_CATALOG_IF_EMPTY: "false"
      HAWATCH_SERVICE_NAME: hawatch-stage-api
      HAWATCH_ENVIRONMENT: stage
      HAWATCH_LOG_FILE: /var/log/hawatch/stage-api.jsonl
      METRICS_REQUIRE_AUTH: "true"
    entrypoint: ["gunicorn"]
    command: ["hawatch.config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "2", "--timeout", "60", "--access-logfile", "-"]
    networks: [stage, production-db]
    volumes: ["stage-logs:/var/log/hawatch"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging: &stage-logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
  stage-web:
    image: hawatch-stage-web:${HAWATCH_STAGE_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_QA_PREVIEW: "true"
        VITE_PUBLIC_SITE_ORIGIN: ${HAWATCH_PUBLIC_ORIGIN:-https://hawatch.ir}
    networks: [stage]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging: *stage-logging
    restart: unless-stopped
  stage-gateway:
    image: nginx:1.27-alpine
    ports: ["${HAWATCH_STAGE_BIND_IP:-0.0.0.0}:${HAWATCH_STAGE_PORT:-5050}:80"]
    volumes: ["../nginx/stage.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      stage-api: {condition: service_healthy}
      stage-web: {condition: service_healthy}
    networks: [stage]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging: *stage-logging
    restart: unless-stopped
networks:
  stage: {}
  production-db:
    external: true
    name: ${HAWATCH_PRODUCTION_NETWORK:-hawatch_default}
volumes:
  stage-logs: {}
