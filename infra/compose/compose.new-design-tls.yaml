# Optional operator-managed TLS listener. Does not publish 80/443.
services:
  qa-tls:
    image: nginx:1.27-alpine
    ports: ["${HAWATCH_QA_BIND_IP:-0.0.0.0}:${HAWATCH_QA_TLS_PORT:-5051}:443"]
    volumes:
      - ../nginx/new-design-tls.conf:/etc/nginx/nginx.conf:ro
      - ${HAWATCH_QA_CERT_DIR:?Set certificate directory}:/etc/nginx/qa-certs:ro
    depends_on:
      qa-gateway: {condition: service_started}
    networks: [qa]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
