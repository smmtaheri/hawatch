events {}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Preserve the original scheme when an external TLS proxy/CDN forwards a
    # request. Fall back to the gateway's own scheme for direct HTTP access.
    map $http_x_forwarded_proto $hawatch_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream hawatch_web {
        server web:5173;
        keepalive 16;
    }

    upstream hawatch_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            proxy_pass http://hawatch_api/api/v1/seo/robots.txt;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            # Also protect this URL if an older application image is used.
            # Existing CDN entries still need a one-time purge after rollout.
            proxy_cache off;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Expires "0" always;
        }

        location = /sitemap.xml {
            proxy_pass http://hawatch_api/api/v1/seo/sitemap.xml;
            proxy_set_header Host $host;
        }

        # The old point index remains retired. The new-design route hub is
        # server-rendered by Django so crawlers and no-JS clients see its links.
        location = /points {
            return 301 https://hawatch.ir/;
        }

        location = /points/ {
            return 301 https://hawatch.ir/;
        }

        location ~ ^/routes/?$ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /static/ {
            alias /usr/share/nginx/html/django-static/;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        location /static-v2/ {
            alias /usr/share/nginx/html/django-static/;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        location /api/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Public Home/Point/Route HTML comes from Django so every visitor gets
        # the same meaningful, catalog-driven initial document. React takes
        # over after the stable Vite entry bundle has loaded.
        location = / {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Destination discovery is server-rendered like the public detail
        # pages, while React takes over after the stable entry bundle loads.
        location ~ ^/destinations/?$ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location ~ ^/(points|routes)/[a-z0-9-]+/?$ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Django Admin is a private server-rendered surface. Keep it behind
        # the API upstream so the SPA fallback cannot turn it into a 404.
        location /admin/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://hawatch_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
