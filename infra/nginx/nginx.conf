events {}

http {
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Preserve the original scheme when an external TLS proxy/CDN forwards a
    # request. Fall back to the gateway's own scheme for direct HTTP access.
    map $http_x_forwarded_proto $hawatch_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # Docker keeps service names stable while replacing container IPs. Resolve
    # them continuously instead of pinning the address at Nginx startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream hawatch_web {
        zone hawatch_web 64k;
        server web:5173 resolve;
        keepalive 16;
    }

    upstream hawatch_api {
        zone hawatch_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            proxy_pass http://hawatch_api/api/v1/seo/robots.txt;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            # Also protect this URL if an older application image is used.
            # Existing CDN entries still need a one-time purge after rollout.
            proxy_cache off;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Expires "0" always;
        }

        location = /sitemap.xml {
            proxy_pass http://hawatch_api/api/v1/seo/sitemap.xml;
            proxy_set_header Host $host;
        }

        location /static/ {
            alias /usr/share/nginx/html/django-static/;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        location /static-v2/ {
            alias /usr/share/nginx/html/django-static/;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        location /p/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
        }
        # Weather stays fresh through Redis; shared CDN/proxy caches must bypass it.
        location ~ ^/api/v1/(points|routes)/[a-z0-9-]+/forecast/week/$ {
            proxy_cache off;
            proxy_hide_header CDN-Cache-Control;
            proxy_hide_header Surrogate-Control;
            add_header CDN-Cache-Control "no-store" always;
            add_header Surrogate-Control "no-store" always;
            proxy_pass http://hawatch_api;
            proxy_set_header Host $host;
        }
        location /api/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Generated from the same manifest as Django and React. It owns every
        # public SSR page route; the web upstream only receives SPA/unknown URLs.
        include /etc/nginx/public-pages.inc;

        # Django Admin is a private server-rendered surface. Keep it behind
        # the API upstream so the SPA fallback cannot turn it into a 404.
        location /admin/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://hawatch_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
