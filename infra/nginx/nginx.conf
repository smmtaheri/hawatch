events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Preserve the original scheme when an external TLS proxy/CDN forwards a
    # request. Fall back to the gateway's own scheme for direct HTTP access.
    map $http_x_forwarded_proto $hawatch_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream hawatch_web {
        server web:5173;
        keepalive 16;
    }

    upstream hawatch_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            proxy_pass http://hawatch_api/api/v1/seo/robots.txt;
            proxy_set_header Host $host;
        }

        location = /sitemap.xml {
            proxy_pass http://hawatch_api/api/v1/seo/sitemap.xml;
            proxy_set_header Host $host;
        }

        location /static/ {
            alias /usr/share/nginx/html/django-static/;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        location /api/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Django Admin is a private server-rendered surface. Keep it behind
        # the API upstream so the SPA fallback cannot turn it into a 404.
        location /admin/ {
            proxy_pass http://hawatch_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://hawatch_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
