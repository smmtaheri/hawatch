events {}
http {
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    map $http_x_forwarded_proto $qa_proto { default $http_x_forwarded_proto; "" $scheme; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        set $qa_web http://qa-web:5173;
        set $qa_api http://qa-api:8000;
        server_name _;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_hide_header X-Robots-Tag;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $qa_proto;
        proxy_read_timeout 60s;
        location = /healthz { return 200 "ok\n"; }
        location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
        location = /sitemap.xml { return 404; }
        location /admin/ { return 404; }
        location /api/ { proxy_pass $qa_api; }
        location = / { proxy_pass $qa_api; }
        location ~ ^/(destinations(/page/[0-9]+)?|routes)/?$ { proxy_pass $qa_api; }
        location ~ ^/(points|routes)/[a-z0-9-]+/?$ { proxy_pass $qa_api; }
        location / { proxy_pass $qa_web; }
    }
}
