[project]
name = "hawatch-api"
version = "0.1.0"
description = "Hawatch internal Django REST API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django>=5.2.8,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "psycopg[binary]>=3.2.9,<3.3",
  "django-cors-headers>=4.7.0,<5",
  "gunicorn>=23.0.0,<24",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-django>=4.11.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hawatch.config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
# The API Compose service runs in production mode. Keep the ordinary
# `docker compose … exec api pytest` command isolated from that runtime
# configuration as well as from its live database and provider settings.
addopts = "-q --reuse-db --ds=hawatch.config.settings.test"

[tool.uv]
package = false
