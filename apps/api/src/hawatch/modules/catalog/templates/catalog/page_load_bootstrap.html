<script>
/* Shared with Vite's HTML build. No dependency on application/CDN scripts. */
(function () {
  var path = window.location.pathname, timer, done = false, assetFailed = false;
  var message = 'بارگذاری صفحه کامل نشده؛ لطفاً صفحه را رفرش کنید.';
  function notice() {
    if (done || !document.body) return;
    var node = document.getElementById('hawatch-page-load-notice');
    if (!node) {
      node = document.createElement('div');
      node.id = 'hawatch-page-load-notice';
      node.className = 'hawatch-state page-load-notice';
      node.setAttribute('role', 'status');
      node.setAttribute('aria-live', 'polite');
      document.body.appendChild(node);
    }
    node.textContent = message;
  }
  function hide() {
    var node = document.getElementById('hawatch-page-load-notice');
    if (node) node.remove();
  }
  window.__hawatchPageLoad = {
    start: function (next) {
      if (next === path && !done) return;
      path = next; done = false; clearTimeout(timer); hide();
      timer = setTimeout(notice, 15000);
    },
    complete: function (current) {
      if (current !== path) return;
      if (assetFailed) { notice(); return; }
      done = true; clearTimeout(timer); hide();
    },
    fail: function (current) {
      if (current !== path) return;
      done = false; clearTimeout(timer); notice();
    }
  };
  timer = setTimeout(notice, 15000);
  window.addEventListener('error', function (event) {
    var target = event.target;
    if (!target || !target.tagName) return;
    var url = target.src || target.href || '';
    if ((target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet')) &&
        url.indexOf(window.location.origin + '/static-assets/') === 0) {
      assetFailed = true;
      window.__hawatchPageLoad.fail(path);
    }
  }, true);
  // Start only the current page's first read. The application consumes the same
  // Response promise, including failures; no retry, polling, or analytics here.
  var match = path.match(/^\/(points|routes)\/([a-z0-9-]+)\/?$/), endpoint, credentials = 'same-origin';
  if (match) {
    endpoint = '/api/v1/' + match[1] + '/' + match[2] + '/forecast/week/';
    credentials = 'omit';
  } else if ((match = path.match(/^\/(destinations|routes)(?:\/page\/([1-9][0-9]*))?\/?$/))) {
    endpoint = '/api/v1/' + match[1] + '/?page=' + (match[2] || '1');
  } else if (/^\/account\/plans\/?$/.test(path)) {
    endpoint = '/api/v1/auth/plans/';
  } else if (path === '/' && !document.getElementById('home-initial-data')) {
    endpoint = '/api/v1/points/';
  }
  if (endpoint) {
    try {
      var request = fetch(endpoint, { credentials: credentials });
      window.__hawatchInitialPageRequest = {
        url: new URL(endpoint, window.location.origin).href,
        credentials: credentials, response: request
      };
      request.catch(function () {});
    } catch (error) {
      window.__hawatchPageLoad.fail(path);
    }
  }
})();
</script>
