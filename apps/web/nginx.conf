server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 =404 @spa_not_found;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    # Django's SEO HTML intentionally refers to stable Vite entry names.
    # Do not store them so a mobile browser or CDN never keeps an older
    # stylesheet after a deploy. Content-addressed chunks may
    # still be cached independently.
    location = /assets/hawatch.css {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /assets/hawatch.css =404;
    }

    location = /assets/hawatch.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /assets/hawatch.js =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # The catalog index pages are retired. Redirect before the SPA so
    # JavaScript-disabled clients and crawlers receive one permanent hop.
    location = /points {
        return 301 https://hawatch.ir/;
    }

    location = /points/ {
        return 301 https://hawatch.ir/;
    }

    location = /routes {
        return 301 https://hawatch.ir/;
    }

    location = /routes/ {
        return 301 https://hawatch.ir/;
    }

    # Validate dynamic canonical pages through the API first. This prevents a
    # static SPA fallback from turning an unknown Point/Route into HTTP 200.
    location ~ ^/points/(?<point_slug>[a-z0-9-]+)/?$ {
        auth_request /__point_exists;
        error_page 401 =404 @spa_not_found;
        try_files /index.html =404;
    }

    location ~ ^/routes/(?<route_slug>[a-z0-9-]+)/?$ {
        auth_request /__route_exists;
        error_page 401 =404 @spa_not_found;
        try_files /index.html =404;
    }

    location = /__point_exists {
        internal;
        proxy_pass http://api:8000/api/v1/points/$point_slug/;
        proxy_intercept_errors on;
        error_page 404 =401 @auth_not_found;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /__route_exists {
        internal;
        proxy_pass http://api:8000/api/v1/routes/$route_slug/;
        proxy_intercept_errors on;
        error_page 404 =401 @auth_not_found;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @spa_not_found {
        default_type text/html;
        add_header X-Robots-Tag "noindex, follow" always;
        return 404 "<!doctype html><html lang=\"fa\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"robots\" content=\"noindex,follow\"><title>صفحه پیدا نشد | هواچ</title></head><body><h1>صفحه پیدا نشد</h1></body></html>";
    }

    location @auth_not_found {
        internal;
        return 401;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
