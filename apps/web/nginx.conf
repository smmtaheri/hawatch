# Docker replaces container IPs on recreate. Keep this resolver and shared
# upstream in the http context for every API hop from this long-lived proxy.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
map $http_x_forwarded_proto $hawatch_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
upstream hawatch_api {
    zone hawatch_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 =404 @spa_not_found;

    location /static-public/ {
        alias /var/lib/hawatch-frontend/static-public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /static-assets/ {
        alias /var/lib/hawatch-frontend/static-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    location ~ ^/(home|point|route|destinations|routes|login|plans|not-found)\.html$ {
        internal;
    }

    # Django's SEO HTML intentionally refers to stable Vite entry names.
    # Do not store them so a mobile browser or CDN never keeps an older
    # stylesheet after a deploy. Content-addressed chunks may
    # still be cached independently.
    location = /assets/hawatch.css {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /assets/hawatch.css =404;
    }

    location = /assets/hawatch.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /assets/hawatch.js =404;
    }

    # Direct web access and gateway traffic share the same service-DNS policy.
    location /p/ {
        proxy_pass http://hawatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://hawatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hawatch_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location @spa_not_found {
        default_type text/html;
        add_header X-Robots-Tag "noindex, follow" always;
        return 404 "<!doctype html><html lang=\"fa\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"robots\" content=\"noindex,follow\"><title>صفحه پیدا نشد | هواچ</title></head><body><h1>صفحه پیدا نشد</h1></body></html>";
    }

    # Generated from the same manifest as Django and React. Public HTML URLs
    # always reach their server-rendered handler, including pagination.
    include /etc/nginx/public-pages.inc;

    location / {
        try_files $uri =404;
    }
}
