# QA assets/known SPA routes only. The independent gateway owns API and SSR.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    error_page 404 =404 @qa_not_found;
    location /static-public/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /static-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }
    location ~ ^/assets/hawatch\.(js|css)$ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }
    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /account/plans { try_files /index.html =404; }
    location = /account/plans/ { try_files /index.html =404; }
    location / { try_files $uri =404; }
    location @qa_not_found {
        default_type text/html;
        return 404 "<!doctype html><html lang=\"fa\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"robots\" content=\"noindex,nofollow\"><title>صفحه پیدا نشد | هواچ</title></head><body><h1>صفحه پیدا نشد</h1></body></html>";
    }
}
