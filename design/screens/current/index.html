<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>گالری سیستم طراحی جاری هواچ</title><style>body{margin:24px;font-family:Tahoma,sans-serif;background:#e7eff1;color:#112349}p{line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid #007c8b;border-radius:10px;background:white;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#007c8b;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:24px}article{padding:12px;border-radius:14px;background:white}img{display:block;width:100%;height:auto;margin-top:10px}article a{display:block;color:#007c8b;margin-top:10px}h2{font-size:18px}</style><h1>سیستم طراحی جاری هواچ</h1><p>سیستم سطح و رنگ نسخهٔ قبلی سایت، با چیدمان تأییدشدهٔ پیش‌بینی هفتگی. تصاویر اجرای محلی با دادهٔ واقعی بازپخش‌شده‌اند. برای مقصد و مسیر، تصویر دوم پایین صفحه با جزئیات یا تجهیزات باز است.</p><nav><button data-device="mobile" aria-pressed="true">موبایل</button><button data-device="desktop" aria-pressed="false">دسکتاپ</button><button data-theme="light" aria-pressed="true">روشن</button><button data-theme="dark" aria-pressed="false">تاریک</button></nav><div class="grid" id="grid"></div><script>const names={home:'خانه',point:'مقصد',route:'مسیر',destinations:'همهٔ مقصدها',routes:'همهٔ مسیرها',subscription:'اشتراک'};let device='mobile',theme='light';function draw(){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device?b.dataset.device===device:b.dataset.theme===theme)));document.getElementById('grid').innerHTML=Object.entries(names).map(([key,label])=>`<article><h2>${label}</h2><a href="${device}/${theme}/${key}.jpg"><img src="${device}/${theme}/${key}.jpg" alt="${label}"></a>${['point','route'].includes(key)?`<a href="${device}/${theme}/${key}-expanded.jpg">پایین صفحه با بخش باز<img src="${device}/${theme}/${key}-expanded.jpg" alt="${label} با بخش باز"></a>`:''}</article>`).join('')}document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.device)device=b.dataset.device;else theme=b.dataset.theme;draw()};draw();</script></html>
